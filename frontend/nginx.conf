server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (they have content hashes from Vite)
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # NOTE: No WebSocket proxy is needed here.
    # The frontend derives the WebSocket URL from VITE_API_BASE_URL (the Kong
    # gateway), so WS traffic goes directly to Kong — the same route used by
    # all REST API calls. nginx only serves static files.
}
